spring.application.name=jpaTuts

#properties related to jpa
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#to connect to a database
spring.datasource.url=jdbc:mysql://localhost:3307/test?useSSL=false
#database username
spring.datasource.username=root
#database password
spring.datasource.password=nand123

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:/data.sql

logging.level.org.springframework.jdbc.datasource.init=TRACE
logging.level.org.hibernate.SQL=DEBUG

spring.jpa.open-in-view=false